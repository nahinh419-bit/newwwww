<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>রোগ-নির্ণয়: উপসর্গ, ডাক্তার ও অ্যাপয়েন্টমেন্ট</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#f4f8f7;--card:#fff;--tx:#14231f;--mu:#63736d;--pr:#087f65;--pr2:#0ba889;--bd:#e0eae5;--warn:#a93226;--wbg:#fff0ed;--shadow:0 12px 35px rgba(20,55,43,.07)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Hind Siliguri','Inter',system-ui,sans-serif;background:radial-gradient(ellipse at 10% 0%,#e2f5ed 0,transparent 36%),var(--bg);color:var(--tx);line-height:1.7;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);border-bottom:1px solid rgba(210,226,218,.8)}
.hd{max-width:1160px;margin:auto;padding:13px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-family:Inter,'Hind Siliguri',sans-serif;font-weight:800;font-size:1.12rem;color:var(--pr);margin-right:auto;letter-spacing:-.03em}
nav{display:flex;flex-wrap:wrap;gap:7px}
nav a{color:#40534b;text-decoration:none;font-size:.96rem;font-weight:600;padding:8px 13px;border-radius:999px;transition:.2s}
nav a:hover{background:#e7f5ef;color:var(--pr)}
.w{max-width:1160px;margin:0 auto;padding:34px 22px 70px}
h1,h2,h3{line-height:1.25;letter-spacing:-.02em}
h2{font-size:clamp(1.55rem,3vw,2.15rem);margin:8px 0 8px;font-weight:700}
h3{font-size:1.25rem}
p.sub{color:var(--mu);font-size:1.06rem;margin:0 0 22px;max-width:760px}
.m{color:var(--mu);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:clamp(17px,3vw,26px);margin-bottom:18px;box-shadow:var(--shadow)}
input,select{width:100%;padding:13px 14px;border:1px solid #d7e4dd;border-radius:12px;background:#fbfdfc;color:var(--tx);font:inherit;margin:6px 0 14px;outline:none;transition:.2s}
input:focus,select:focus{border-color:var(--pr2);box-shadow:0 0 0 4px rgba(11,168,137,.12)}
label{font-size:.94rem;color:#53665e;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px;max-height:280px;overflow:auto;padding:2px}
.chip{padding:9px 15px;border:1px solid #dbe8e1;border-radius:999px;background:#f7fbf8;color:#34483f;cursor:pointer;font:inherit;font-size:.94rem;transition:.18s}
.chip:hover{border-color:var(--pr2);transform:translateY(-1px)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr);box-shadow:0 5px 14px #087f6530}
.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
button.main,.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;padding:12px 21px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;box-shadow:0 7px 16px rgba(8,127,101,.16);transition:.2s}
button.main:hover,.btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
.btn.sm{padding:7px 13px;font-size:.86rem;margin:8px 7px 0 0}
button.ghost{background:#fff;border:1px solid var(--bd);color:var(--tx);padding:11px 17px;border-radius:12px;font:inherit;cursor:pointer}
button.s{padding:7px 12px;font-size:.84rem;border-radius:9px;border:1px solid var(--bd);background:#f8fbf9;color:var(--tx);cursor:pointer;margin:3px}
button.s:hover,button.ghost:hover{border-color:var(--pr);color:var(--pr)}
.alert{background:var(--wbg);color:var(--warn);border:1px solid #ffd6cf;border-radius:13px;padding:13px 16px;margin-bottom:15px;font-weight:600}
.res{padding:17px 0;border-top:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:1.02rem}
.bar{height:9px;background:#e8f0eb;border-radius:99px;overflow:hidden;margin:9px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),#4dd6ac);border-radius:99px}
.dc{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:9px;margin-bottom:16px}
.tabs label{flex:1;text-align:center;padding:10px;border:1px solid var(--bd);border-radius:12px;cursor:pointer;color:var(--tx);background:#f8fbf9}
.tabs input{display:none}
.tabs label:has(input:checked){background:#e6f6ef;color:var(--pr);border-color:#9bd9c3}
.badge{padding:4px 11px;border-radius:99px;font-size:.82rem;background:#edf2ef}
.b-confirmed,.b-done{background:#dff6eb;color:#08764f}
.b-cancelled{background:var(--wbg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px;margin-bottom:18px}
.stats .card{text-align:center;margin:0;padding:20px 12px}
.stats b{font-size:1.9rem;color:var(--pr);display:block}
.ap{padding:14px 0;border-top:1px solid var(--bd)}
.modal{position:fixed;inset:0;background:rgba(9,25,19,.62);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:520px;width:100%;max-height:92vh;overflow:auto;margin:0}
.note{font-size:.86rem;color:var(--mu);padding:14px 0 0}
footer{color:var(--mu)}
@media(max-width:680px){.hd{padding:10px 15px;gap:8px}.logo{width:100%;font-size:1rem}nav{width:100%;gap:3px}nav a{padding:7px 9px;font-size:.88rem}.w{padding:24px 14px 55px}.card{border-radius:16px}.tabs{gap:5px}.tabs label{padding:8px 4px;font-size:.9rem}}
</style></head><body>
<header><div class="hd"><span class="logo">🩺 রোগ-নির্ণয় <small style="font-size:.7em;color:#7a9186;font-weight:500">HEALTH PLATFORM</small></span><nav id="nav"></nav></div></header>
<main class="w"><div id="view"></div>
<p class="note">⚠️ এটি শিক্ষামূলক প্রকল্প, চিকিৎসকের বিকল্প নয়। জরুরি অবস্থায় ৯৯৯ এ কল করুন। স্বাস্থ্য বাতায়ন: ১৬২৬৩।</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="geo.js"></script><script src="model.js"></script><script src="app.js"></script>
</body></html>
